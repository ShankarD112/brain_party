name: Test browser game

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: brain-party-website
          path: dist/
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- tests/browser/explore.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-checks
          path: test-results/
          retention-days: 7
      - run: npm run test:browser -- tests/browser/game.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
